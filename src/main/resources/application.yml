spring:
  application:
    name: JWTSecurity

  # Locally, values can come from a gitignored .env file (see .env.example); on Azure they are App Settings.
  config:
    import: optional:file:.env[.properties]

  app:
    jwtSecret: ${JWT_SECRET}
    # Every endpoint except login/sign-up needs a valid JWT and the app has no refresh, so it must outlive a
    # "stay logged in" session: 30 days (the app logs the user out when it expires)
    jwtExpirationMs: ${JWT_EXPIRATION_MS:2592000000}

  data:
    mongodb:
      authentication-database: admin
      database: ${MONGODB_DATABASE:artly}
      uri: ${MONGODB_URI}

  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
      enabled: true

server:
  port: ${PORT:7040}

# Firebase project whose phone-auth ID tokens the backend accepts (not a secret)
firebase:
  project-id: ${FIREBASE_PROJECT_ID:loyal-optics-388515}
  # Chat (/chat/token, /chat/notify): base64 of a service-account key JSON of that project (SECRET, App Setting only).
  # Empty = chat is disabled and /chat/** answers 503.
  service-account-b64: ${FIREBASE_SERVICE_ACCOUNT_B64:}

# Calls (/chat/call/**) run on Agora RTC. The App ID is public (the app receives it with every token); the App
# Certificate signs the tokens and is a SECRET (App Setting only). Either one empty = calls are disabled and
# /chat/call/** answers 503. Calls also need the Firebase service account above.
agora:
  app-id: ${AGORA_APP_ID:}
  app-certificate: ${AGORA_APP_CERTIFICATE:}
