spring:
  application:
    name: JWTSecurity

  # Locally, values can come from a gitignored .env file (see .env.example); on Azure they are App Settings.
  config:
    import: optional:file:.env[.properties]

  app:
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:3000000}

  data:
    mongodb:
      authentication-database: admin
      database: ${MONGODB_DATABASE:artly}
      uri: ${MONGODB_URI}

  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
      enabled: true

server:
  port: ${PORT:7040}
